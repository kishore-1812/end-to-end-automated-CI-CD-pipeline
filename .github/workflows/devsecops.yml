    #       body: |
    #         Security scan failure in repository ${{ github.repository }}.
    #         Workflow: ${{ github.workflow }}
    #         Run: ${{ github.run_id }}
    #         Check details at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  zap_scan:
    needs: build_and_scan
    runs-on: ubuntu-latest

    # services:
    #   web:
    #     image: fastapi-app:latest
    #     ports:
    #       - 8000:8000

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build FastAPI image
        run: docker build -t fastapi-app:latest -f src/fastapi/fastAPI.dockerfile src/fastapi

      - name: Run FastAPI container (background)
        run: docker run -d -p 8000:8000 --name fastapi-test fastapi-app:latest

      - name: Check for the container's health
        run: |
          for i in {1..10}; do
            curl --fail http://localhost:8000/health && break || sleep 3
          done

      - name: Run OWASP ZAP baseline scan (Docker)
        run: |
          docker run --network host \
            -v ${{ github.workspace }}:/zap/wrk:rw \
            zaproxy/zap-stable \
            zap-baseline.py -t http://localhost:8000 \
            -J /zap/wrk/report.json \
            -w /zap/wrk/report.md \
            -r /zap/wrk/report.html || true

      - name: List ZAP files before upload
        run: ls -la report.* 2>/dev/null || echo "No ZAP reports found"

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report.html

