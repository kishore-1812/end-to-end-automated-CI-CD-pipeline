name: CI - DevSecOps Pipeline

on:
  push:
    branches: [ stage ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('src/fastapi/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/fastapi/requirements.txt

      - name: Lint check (flake8)
        run: |
          pip install flake8
          flake8 . --exclude=venv,env,.venv,site-packages,__pycache__,*.egg

      - name: Run Bandit (Python security scan)
        run: |
          pip install bandit
          bandit -r app/ -f json -o bandit-report.json || echo "Bandit found issues"

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Run Checkov (IaC scan)
        run: |
          pip install checkov
          checkov -d src/terraform/ -o json > checkov-report.json || echo "Checkov found issues"

      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.json

      # ← ADD THIS: Build Docker image BEFORE Trivy
      - name: Build FastAPI image
        run: docker build -t fastapi-app:latest -f src/fastapi/fastAPI.dockerfile src/fastapi

      - name: Run Trivy scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          ./bin/trivy image \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 \
            --format json \
            --output trivy-report.json \
            fastapi-app:latest

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json


  zap_scan:
    needs: build_and_scan
    runs-on: ubuntu-latest

    # services:
    #   web:
    #     image: fastapi-app:latest
    #     ports:
    #       - 8000:8000

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build FastAPI image
        run: docker build -t fastapi-app:latest -f src/fastapi/fastAPI.dockerfile src/fastapi

      - name: Run FastAPI container (background)
        run: docker run -d -p 8000:8000 --name fastapi-test fastapi-app:latest

      - name: Check for the container's health
        run: |
          for i in {1..10}; do
            curl --fail http://localhost:8000/health && break || sleep 3
          done

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --network host \
            --user root \
            -v ${{ github.workspace }}:/zap/wrk:rw \
            zaproxy/zap-stable \
            sh -c "
              chmod 777 /zap/wrk && \
              zap-baseline.py -t http://localhost:8000 \
                -r /zap/wrk/report.html \
                -J /zap/wrk/report.json
            " || true


      # ADD THIS - Check ZAP logs FIRST
      - name: Check ZAP container logs
        run: |
          echo "=== Checking for ZAP containers ==="
          docker ps -a | grep -i zap || echo "No ZAP containers found"
          
          echo ""
          echo "=== Checking docker volume mounts ==="
          docker inspect $(docker ps -a --format "{{.ID}}" | head -1) 2>/dev/null | grep -A 10 "Mounts" || echo "Could not inspect container"
      - name: List workspace contents
        run: |
          echo "=== Current Working Directory ==="
          pwd
          
          echo ""
          echo "=== Files in Workspace Root ==="
          ls -la ${{ github.workspace }}/
          
          echo ""
          echo "=== Looking for report files ==="
          find ${{ github.workspace }} -name "report*" -o -name "*.html" -o -name "*.json" 2>/dev/null
          
          echo ""
          echo "=== Check specific paths ==="
          ls -la ${{ github.workspace }}/report.html 2>&1 || echo "report.html not found"
          ls -la ${{ github.workspace }}/report.json 2>&1 || echo "report.json not found"

      - name: Copy reports to workspace
        run: |
          cp -v /tmp/zap-reports/report.html ${{ github.workspace }}/ || true
          cp -v /tmp/zap-reports/report.json ${{ github.workspace }}/ || true
          ls -la ${{ github.workspace }}/report.*

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: ${{ github.workspace }}/report.html
